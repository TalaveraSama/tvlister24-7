<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proca Automation · 24/7 para OBS</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/assets/logo.svg" alt="" class="brand-mark" />
        <div>
          <div class="brand-name">PROCA</div>
          <div class="brand-sub">Automation + OBS</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a href="#/monitor" data-view="monitor" class="nav-item"><span class="nav-ico">◉</span>Monitoreo</a>
        <div class="nav-group">Programación</div>
        <a href="#/playlists" data-view="playlists" class="nav-item"><span class="nav-ico">≡</span>Listas 24/7</a>
        <a href="#/grid" data-view="grid" class="nav-item"><span class="nav-ico">▤</span>Parrilla</a>
        <a href="#/ads" data-view="ads" class="nav-item"><span class="nav-ico">▶</span>Publicidad</a>
        <a href="#/library" data-view="library" class="nav-item"><span class="nav-ico">▦</span>Biblioteca</a>
        <div class="nav-group">Control</div>
        <a href="#/graphics" data-view="graphics" class="nav-item"><span class="nav-ico">◫</span>Gráficos</a>
        <a href="#/live" data-view="live" class="nav-item"><span class="nav-ico">●</span>En vivo / Cámaras</a>
        <a href="#/recording" data-view="recording" class="nav-item"><span class="nav-ico">⏺</span>Grabación</a>
        <a href="#/emergency" data-view="emergency" class="nav-item"><span class="nav-ico">⚠</span>Anti pantalla negra</a>
        <div class="nav-group">Registro</div>
        <a href="#/asrun" data-view="asrun" class="nav-item"><span class="nav-ico">☰</span>As-Run</a>
        <a href="#/settings" data-view="settings" class="nav-item"><span class="nav-ico">⚙</span>Ajustes</a>
      </nav>

      <div class="sidebar-foot">
        <div class="obs-chip" id="obs-chip">
          <span class="dot"></span>
          <span class="obs-text">OBS…</span>
        </div>
        <a class="overlay-link" href="/overlay" target="_blank" rel="noopener">Abrir gráficos (OBS) ↗</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menu-btn" aria-label="Menú">☰</button>
        <div class="onair">
          <span class="onair-badge" id="mode-badge">EN ESPERA</span>
          <div class="onair-text">
            <div class="onair-title" id="onair-title">—</div>
            <div class="onair-sub" id="onair-sub">Conectando con Proca…</div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="progress-mini" title="Progreso del contenido actual">
            <div class="progress-mini-bar" id="mini-progress"></div>
          </div>
          <div class="clock-box">
            <div class="clock" id="clock">--:--:--</div>
            <div class="clock-date" id="clock-date"></div>
          </div>
          <button class="btn btn-ghost" id="quick-pause" title="Pausar / continuar">⏸</button>
          <button class="btn btn-ghost" id="quick-next" title="Siguiente">⏭</button>
        </div>
      </header>

      <main class="view" id="view">
        <div class="loading">Cargando Proca…</div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
