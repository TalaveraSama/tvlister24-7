services:
  tvlister24-7:
    build: .
    container_name: tvlister24-7
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./streams_runtime:/app/streams_runtime
    environment:
      - NODE_ENV=production
      - PORT=8080
      - PANEL_SECRET=cambia-esta-clave-en-produccion
